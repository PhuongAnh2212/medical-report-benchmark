# =============================================================================
# models.yaml
#
# Registry of all supported Vision-Language Models. Each entry defines the
# HuggingFace checkpoint, the Python class implementing the model, and any
# model-specific defaults. `inference/generate_reports.py` looks up the
# `model.name` field from default.yaml (or a CLI override) in this file.
#
# To add a new model:
#   1. Add an entry here.
#   2. Implement a class in models/<your_model>.py that subclasses
#      models.base_model.BaseReportGenerator.
#   3. Register the class in models/__init__.py's MODEL_REGISTRY.
# =============================================================================

